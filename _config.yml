title: ProfitEngine Content
description: Practical articles on passive income, SaaS tools, automation, IT operations, and online business
baseurl: /content
# Canonical domain: articles are served at www.alreadyherellc.com/content/*
# via the production site rewrite. Search authority consolidates on this domain.
url: https://www.alreadyherellc.com
theme: minima
lang: en-US

markdown: kramdown
permalink: /posts/:title/
future: false
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - .github
  - .alreadyhere
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - scripts
  - tests
  - vendor

paginate: 10
paginate_path: /page/:num/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: ProfitEngine AI
  - scope:
      path: "city-pages"
    values:
      layout: city

social:
  name: ProfitEngine
  links: []
