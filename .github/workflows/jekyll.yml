name: Jekyll production build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Block unreviewed rewrites of published posts
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            rewrites="$(git diff --name-status HEAD~1 HEAD -- '_posts/*.md' | awk '$1 ~ /^M/ {print}')"
            if [ -n "$rewrites" ] && [ "${ALLOW_CONTENT_REWRITE:-false}" != "true" ]; then
              echo "Published post rewrite blocked. Corrections must be reviewed before main is updated."
              echo "$rewrites"
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test article normalization
        run: python -m unittest discover -s tests -v

      - name: Enforce normalized articles
        run: python scripts/normalize_articles.py --check _posts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Validate generated site
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/sitemap.xml
          test -s _site/feed.xml
          if grep -R -n -E '\\"(body|meta_description|slug)\\"[[:space:]]*:' _site/posts --include='*.html'; then
            echo 'Serialized article payload leaked into generated HTML.' >&2
            exit 1
          fi
