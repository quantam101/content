name: Jekyll production build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test article normalization
        run: python -m unittest discover -s tests -v

      - name: Normalize articles before rendering
        run: |
          python scripts/normalize_articles.py --write _posts
          python scripts/normalize_articles.py --check _posts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Validate generated site
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/sitemap.xml
          test -s _site/feed.xml
          test -s _site/posts/passive-income-stock-photos-2026/index.html
          if grep -R -n -E '\\"(body|meta_description|slug)\\"[[:space:]]*:' _site/posts --include='*.html'; then
            echo 'Serialized article payload leaked into generated HTML.' >&2
            exit 1
          fi
