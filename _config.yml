title: Already Here LLC
description: Practical guides on managed IT, network infrastructure, cabling, VoIP and onsite IT field service from Already Here LLC in Phoenix, Arizona
# Default share preview (rendered by the main site's app/opengraph-image.tsx)
image: https://www.alreadyherellc.com/opengraph-image
baseurl: /content
# Canonical domain: articles are served at www.alreadyherellc.com/content/*
# via the production site rewrite. Search authority consolidates on this domain.
url: https://www.alreadyherellc.com
theme: minima
lang: en-US

markdown: kramdown
permalink: /posts/:title/
future: false
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - .github
  - .alreadyhere
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - scripts
  - tests
  - vendor

paginate: 10
paginate_path: /page/:num/

defaults:
  # Indexing policy (2026-10-19): this site is indexed only for IT and
  # field-service topics. Everything is noindex and out of the sitemap by
  # default; on-topic pages opt in with `noindex: false` and `sitemap: true`.
  - scope:
      path: ""
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "ebooks/arizona-field-coverage-guide"
    values:
      sitemap: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Already Here LLC
  - scope:
      path: "city-pages"
    values:
      layout: city

social:
  name: Already Here LLC
  links: []
