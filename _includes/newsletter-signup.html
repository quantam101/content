<div class="newsletter-signup" style="border:1px solid #d7dbe8;border-radius:12px;padding:18px;margin:24px 0;background:#f8f9ff">
  <h2 style="margin:0 0 6px;font-size:1.15rem">Get the weekly revenue-intelligence digest</h2>
  <p style="margin:0 0 12px;font-size:0.9rem;color:#444">
    New verified opportunities, production stats, and digital products — every Monday. No spam, unsubscribe anytime.
  </p>
  <form id="ah-newsletter-form" novalidate>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="email" name="email" required placeholder="you@example.com" autocomplete="email"
        style="flex:1;min-width:220px;padding:10px 12px;border:1px solid #c5cbe0;border-radius:8px;font-size:0.95rem">
      <button type="submit" style="padding:10px 18px;background:#3b49e0;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">
        Subscribe
      </button>
    </div>
    <label style="display:block;margin-top:8px;font-size:0.78rem;color:#555">
      <input type="checkbox" name="consent" required>
      I consent to receive the Already Here newsletter.
    </label>
    <p id="ah-newsletter-status" role="status" style="margin:8px 0 0;font-size:0.85rem"></p>
  </form>
  <script>
  (function () {
    var form = document.getElementById('ah-newsletter-form');
    if (!form) return;
    var status = document.getElementById('ah-newsletter-status');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = 'Enter a valid email address.';
        return;
      }
      if (!form.consent.checked) {
        status.textContent = 'Please check the consent box.';
        return;
      }
      var button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      status.textContent = 'Subscribing…';
      fetch('https://app.alreadyherellc.com/api/newsletter/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          consent: true,
          source: 'canonical-blog',
          utmSource: 'canonical-blog',
          utmMedium: 'signup-form',
          utmCampaign: 'weekly-digest'
        })
      }).then(function (r) { return r.json().catch(function(){ return {}; }); })
        .then(function (data) {
          if (data && data.ok) {
            status.textContent = data.status === 'pending'
              ? 'Check your inbox to confirm your subscription.'
              : 'You are subscribed. First issue arrives Monday.';
            form.reset();
          } else {
            status.textContent = (data && data.error) || 'Subscription failed — try again later.';
          }
        })
        .catch(function () {
          status.textContent = 'Network error — try again later.';
        })
        .finally(function () {
          button.disabled = false;
        });
    });
  })();
  </script>
</div>
